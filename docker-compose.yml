services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ntro_rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ntro_clickhouse
    ports:
      - "8123:8123"    # HTTP interface
      - "9000:9000"    # Native protocol
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ntro_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: ntro_neo4j
    ports:
      - "7474:7474"    # HTTP Browser UI
      - "7687:7687"    # Bolt protocol (driver connections)
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/ntro_password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  rabbitmq_data:
  clickhouse_data:
  clickhouse_logs:
  neo4j_data:
  neo4j_logs:
